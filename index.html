<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物質量（mol）と粒子・質量・体積の変換シミュレーター</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --accent: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .tab-content.active {
            display: block;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .sim-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .sim-grid {
                grid-template-columns: 1fr;
            }
        }

        .canvas-container {
            position: relative;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 320px;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .output-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }

        .card {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 4px;
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            text-align: left;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .quiz-option:hover {
            background: #e2e8f0;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .feedback.incorrect {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-action:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>物質量（mol）インタラクティブ・シミュレーター</h1>
        <p>ミクロな結晶構造・粒子の配列とマクロな量の関係を体験しよう！</p>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab(0)">① 物質量 → 3量の変換</button>
        <button class="nav-btn" onclick="switchTab(1)">② 3量 → 物質量の逆算</button>
        <button class="nav-btn" onclick="switchTab(2)">③ モル計算クイズ</button>
    </nav>

    <!-- Tab 1: mol -> 3量 -->
    <div class="tab-content active" id="tab-0">
        <div class="controls">
            <div class="control-group">
                <label for="substance-select-1">物質の選択 (種類・結晶構造):</label>
                <select id="substance-select-1" onchange="updateTab1()">
                    <option value="NaCl">塩化ナトリウム NaCl (イオン結晶)</option>
                    <option value="Fe">鉄 Fe (金属結晶)</option>
                    <option value="C">炭素/黒鉛 C (層状構造/グラフェン)</option>
                    <option value="H2O">水 H₂O (分子)</option>
                    <option value="CO2">二酸化炭素 CO₂ (分子)</option>
                    <option value="Ar">アルゴン Ar (単原子)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="mol-slider">物質量: <span id="mol-val-display">1.00</span> mol</label>
                <input type="range" id="mol-slider" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateTab1()">
            </div>
        </div>

        <div class="sim-grid">
            <div class="canvas-container">
                <canvas id="canvas-tab1"></canvas>
                <div class="canvas-overlay" id="canvas-info-1">結晶・粒子構造モデル</div>
            </div>
            <div class="output-panel">
                <div class="card" style="border-color: #2563eb;">
                    <div class="card-title">① 粒子の個数（アボガドロ定数: 6.0×10²³ /mol）</div>
                    <div class="card-value" id="out-count">6.0 × 10²³ 個</div>
                </div>
                <div class="card" style="border-color: #10b981;">
                    <div class="card-title">② 質量（モル質量 $M$）</div>
                    <div class="card-value" id="out-mass">58.5 g</div>
                </div>
                <div class="card" style="border-color: #f59e0b;">
                    <div class="card-title">③ 気体の体積（標準状態: 0℃, 1atm）</div>
                    <div class="card-value" id="out-vol">22.4 L（気体のみ適用）</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 2: 3量 -> mol -->
    <div class="tab-content" id="tab-1">
        <div class="controls">
            <div class="control-group">
                <label for="substance-select-2">物質を選択:</label>
                <select id="substance-select-2" onchange="updateTab2()">
                    <option value="NaCl">塩化ナトリウム NaCl (式量: 58.5)</option>
                    <option value="Fe">鉄 Fe (原子量: 56.0)</option>
                    <option value="C">炭素 C (原子量: 12.0)</option>
                    <option value="H2O">水 H₂O (分子量: 18.0)</option>
                    <option value="CO2">二酸化炭素 CO₂ (分子量: 44.0)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="input-mode">指定する量を選択:</label>
                <select id="input-mode" onchange="updateTab2()">
                    <option value="mass">質量 (g) から計算</option>
                    <option value="count">個数 (個) から計算</option>
                    <option value="vol">気体の体積 (L) から計算</option>
                </select>
            </div>
            <div class="control-group">
                <label for="input-val">数値を入力:</label>
                <input type="number" id="input-val" value="58.5" step="0.1" oninput="updateTab2()">
            </div>
        </div>

        <div class="sim-grid">
            <div class="canvas-container">
                <canvas id="canvas-tab2"></canvas>
            </div>
            <div class="output-panel">
                <div class="card" style="border-color: #2563eb; background: #eff6ff;">
                    <div class="card-title">計算結果（物質量）</div>
                    <div class="card-value" id="out-calc-mol" style="color: #1d4ed8; font-size: 1.8rem;">1.00 mol</div>
                </div>
                <div class="card" style="border-color: #64748b;">
                    <div class="card-title">計算プロセス (モルブリッジ)</div>
                    <div id="out-calc-process" style="font-size: 0.95rem; margin-top: 5px;">58.5 g ÷ 58.5 g/mol = 1.00 mol</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 3: クイズ -->
    <div class="tab-content" id="tab-2">
        <h2 style="margin-bottom: 15px; color: var(--primary-dark);">モル計算チャレンジ！</h2>
        <div id="quiz-container">
            <p id="quiz-question" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 15px;"></p>
            <div id="quiz-options"></div>
            <div id="quiz-feedback" class="feedback"></div>
